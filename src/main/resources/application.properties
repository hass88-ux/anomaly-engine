# ---------- error handling ----------
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- database ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/anomaly_engine}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ---------- jpa ----------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ---------- auth ----------
jwt.expiration-minutes=60
jwt.secret=${JWT_SECRET}

# ---------- uploads ----------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
anomaly.upload.max-rows=${UPLOAD_MAX_ROWS:500000}
anomaly.upload.retention-hours=6

# ---------- cors ----------
anomaly.cors.origins=${CORS_ORIGINS:http://localhost:5173}